<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GolfTrainer</title>
    <!--
      Every path in this app is relative, never rooted at "/". GitHub Pages
      serves a project repository under /<repo>/, so an absolute path would
      resolve outside the app. Relative paths work at any mount point,
      including the root.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2f7f3'/%3E%3Cg fill='%23a8c0b0'%3E%3Ccircle cx='11' cy='12' r='2'/%3E%3Ccircle cx='19' cy='11' r='2'/%3E%3Ccircle cx='16' cy='18' r='2'/%3E%3Ccircle cx='23' cy='17' r='2'/%3E%3Ccircle cx='10' cy='20' r='2'/%3E%3C/g%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#1b4332" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /*
        Car mode (TD3) sets the type scale even on this diagnostic page: the
        on-course screen is read in sunlight, at arm's length, with gloves on.
        Nothing here should establish habits that screen cannot afford.
      */
      :root {
        --bg: #10231a;
        --surface: #16301f;
        --text: #f2f7f3;
        --muted: #a8c0b0;
        --ok: #4ade80;
        --warn: #fbbf24;
        --fail: #f87171;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem 2rem;
        background: var(--bg);
        color: var(--text);
        font:
          1.125rem/1.5 system-ui,
          -apple-system,
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.25rem;
      }

      .lede {
        color: var(--muted);
        margin: 0 0 2rem;
        font-size: 1rem;
      }

      #status {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }

      .status {
        background: var(--surface);
        border-left: 6px solid var(--muted);
        border-radius: 0.5rem;
        padding: 1rem 1.125rem;
      }

      .status--ok {
        border-left-color: var(--ok);
      }
      .status--warn {
        border-left-color: var(--warn);
      }
      .status--fail {
        border-left-color: var(--fail);
      }

      .status__label {
        display: block;
        font-weight: 600;
      }

      .status__detail {
        display: block;
        color: var(--muted);
        font-size: 0.9375rem;
        margin-top: 0.25rem;
      }

      noscript {
        display: block;
        color: var(--fail);
      }
    </style>
  </head>
  <body>
    <h1>GolfTrainer</h1>
    <p class="lede">Bootstrap check — offline shell, local database, storage durability.</p>

    <noscript>GolfTrainer needs JavaScript to record a round.</noscript>
    <ul id="status"></ul>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
