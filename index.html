<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GolfTrainer</title>
    <!--
      Every path in this app is relative, never rooted at "/". GitHub Pages
      serves a project repository under /<repo>/, so an absolute path would
      resolve outside the app. Relative paths work at any mount point,
      including the root.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <!--
      iOS ignores the manifest when adding to the home screen and reads these
      instead, so they are not duplicates of the manifest icons — they are the
      only icons the platform TD8 is about will ever see. Three sizes because
      iOS asks for three: iPad, iPad Pro, and iPhone at @3x.

      They are opaque by construction (tools/make-icons.mjs). iOS composites an
      alpha channel onto black, so a transparent corner is a black corner.
    -->
    <!--
      The bare link is not redundant. iOS versions that do not match on `sizes`
      fall back to a link without it, and the ones that do match still find the
      sized entries below. Both paths land on the 180, which is what an iPhone
      wants.
    -->
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <!-- The home-screen label. Without it iOS uses <title>, which is a thing
         a screen could one day want to change. -->
    <meta name="apple-mobile-web-app-title" content="GolfTrainer" />
    <meta name="theme-color" content="#1b4332" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /*
        Car mode (TD3) sets the type scale even on this diagnostic page: the
        on-course screen is read in sunlight, at arm's length, with gloves on.
        Nothing here should establish habits that screen cannot afford.
      */
      :root {
        --bg: #10231a;
        --surface: #16301f;
        --text: #f2f7f3;
        --muted: #a8c0b0;
        --ok: #4ade80;
        --warn: #fbbf24;
        --fail: #f87171;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem 2rem;
        background: var(--bg);
        color: var(--text);
        font:
          1.125rem/1.5 system-ui,
          -apple-system,
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.25rem;
      }

      .lede {
        color: var(--muted);
        margin: 0 0 2rem;
        font-size: 1rem;
      }

      /*
        Car mode (TD3). Every tap target below is at least 3rem, and the menu
        items are 4rem: this menu is opened on the sixteenth tee, one-handed,
        wearing a glove, with a group waiting. Anything smaller fails QG2.
      */
      .appbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        position: relative;
      }

      .burger {
        flex: none;
        width: 3.5rem;
        height: 3.5rem;
        display: grid;
        place-items: center;
        gap: 0;
        background: var(--surface);
        color: var(--text);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        cursor: pointer;
        padding: 0;
      }

      .burger:focus-visible,
      .menu__item:focus-visible {
        outline: 3px solid var(--ok);
        outline-offset: 2px;
      }

      .burger__bars,
      .burger__bars::before,
      .burger__bars::after {
        display: block;
        width: 1.5rem;
        height: 2px;
        background: currentColor;
        border-radius: 2px;
      }

      .burger__bars {
        position: relative;
      }

      .burger__bars::before,
      .burger__bars::after {
        content: '';
        position: absolute;
        left: 0;
      }

      .burger__bars::before {
        top: -0.5rem;
      }
      .burger__bars::after {
        top: 0.5rem;
      }

      .menu {
        position: absolute;
        top: 4rem;
        right: 0;
        z-index: 10;
        width: min(22rem, calc(100vw - 2.5rem));
        background: var(--surface);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        box-shadow: 0 1rem 2rem rgb(0 0 0 / 45%);
        overflow: hidden;
      }

      .menu[hidden] {
        display: none;
      }

      .menu__list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .menu__item {
        width: 100%;
        min-height: 4rem;
        display: block;
        text-align: left;
        padding: 0.875rem 1.125rem;
        background: none;
        border: 0;
        border-bottom: 1px solid #23412e;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .menu__list li:last-child .menu__item {
        border-bottom: 0;
      }

      .menu__item:disabled {
        color: var(--muted);
        cursor: not-allowed;
      }

      .menu__hint {
        display: block;
        color: var(--muted);
        font-size: 0.875rem;
        margin-top: 0.125rem;
      }

      #status {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }

      .status {
        background: var(--surface);
        border-left: 6px solid var(--muted);
        border-radius: 0.5rem;
        padding: 1rem 1.125rem;
      }

      .status--ok {
        border-left-color: var(--ok);
      }
      .status--warn {
        border-left-color: var(--warn);
      }
      .status--fail {
        border-left-color: var(--fail);
      }

      .status__label {
        display: block;
        font-weight: 600;
      }

      .status__detail {
        display: block;
        color: var(--muted);
        font-size: 0.9375rem;
        margin-top: 0.25rem;
      }

      noscript {
        display: block;
        color: var(--fail);
      }

      /*
        Screens.

        Every interactive target below is at least 3rem, and the club grid is
        4rem. That is not a style preference: UC1 AC11 measures it, because the
        golfer is wearing a glove and the group behind is watching.
      */
      .brand {
        color: inherit;
        text-decoration: none;
      }

      .screen__header {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        margin: 0 0 1rem;
      }

      .screen__title {
        font-size: 1.5rem;
        margin: 0;
      }

      .screen__subtitle {
        color: var(--muted);
        font-size: 0.9375rem;
        margin: 0.125rem 0 0;
      }

      .back {
        flex: none;
        min-width: 3rem;
        min-height: 3rem;
        background: var(--surface);
        color: var(--text);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        font-size: 1rem;
        cursor: pointer;
      }

      .tiles {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
        margin-bottom: 2rem;
      }

      .tile {
        min-height: 5rem;
        background: var(--surface);
        color: var(--text);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        font-size: 1.125rem;
        font-weight: 600;
        cursor: pointer;
      }

      .card {
        background: var(--surface);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 1.5rem;
      }

      .card__title {
        font-size: 1.125rem;
        margin: 0 0 0.75rem;
      }

      .card__actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .field {
        width: 100%;
        min-height: 3rem;
        padding: 0 0.75rem;
        background: var(--bg);
        color: var(--text);
        border: 1px solid #2b5039;
        border-radius: 0.5rem;
        font-size: 1.0625rem;
      }

      .hint {
        color: var(--muted);
        font-size: 0.9375rem;
        margin: 0.75rem 0 0.5rem;
      }

      .choices {
        display: flex;
        gap: 0.75rem;
      }

      .choice {
        flex: 1;
        min-height: 3.5rem;
        background: #1d3b29;
        color: var(--text);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        font-size: 1.25rem;
        font-weight: 600;
        cursor: pointer;
      }

      .action {
        min-height: 3rem;
        padding: 0 1rem;
        background: #1d3b29;
        color: var(--text);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        font-size: 1rem;
        cursor: pointer;
      }

      .action--quiet {
        background: transparent;
      }

      .action--danger {
        border-color: #6b2b2b;
        color: #ffc9c9;
      }

      .list {
        list-style: none;
        margin: 0 0 1.5rem;
        padding: 0;
        display: grid;
        gap: 0.5rem;
      }

      .list__item {
        width: 100%;
        min-height: 3.5rem;
        display: block;
        text-align: left;
        padding: 0.625rem 0.875rem;
        background: var(--surface);
        color: var(--text);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        cursor: pointer;
      }

      .list__title {
        display: block;
        font-size: 1.0625rem;
        font-weight: 600;
      }

      .list__detail {
        display: block;
        color: var(--muted);
        font-size: 0.875rem;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-height: 3.5rem;
        padding: 0.5rem 0.875rem;
        background: var(--surface);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
      }

      .row__label {
        font-weight: 600;
        min-width: 4.5rem;
      }

      .row__detail {
        flex: 1;
        font-size: 0.875rem;
      }

      .row__detail--muted {
        color: var(--muted);
      }

      /* The planned distance for a stroke, right-aligned so the column of
         numbers reads down the list rather than hiding behind club names. */
      .row__distance {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        color: var(--ok);
        font-weight: 600;
      }

      .row--total {
        background: transparent;
        border-style: dashed;
        margin-bottom: 1rem;
      }

      .row--total:empty {
        display: none;
      }

      .row--total .row__distance {
        color: var(--text);
      }

      /* A hole row carries more than it used to — tee state, par, and a capture
         button — so it wraps rather than squeezing any of them off a phone. */
      .row--hole {
        flex-wrap: wrap;
      }

      .par-picker {
        display: flex;
        gap: 0.25rem;
      }

      .par {
        min-width: 2.75rem;
        min-height: 2.75rem;
        background: var(--surface);
        color: var(--muted);
        border: 1px solid #2b5039;
        border-radius: 0.625rem;
        font-size: 1rem;
        cursor: pointer;
      }

      .par--on {
        background: #24503a;
        color: var(--text);
        outline: 2px solid var(--ok);
      }

      .row__action {
        min-height: 3rem;
        padding: 0 0.875rem;
        background: #1d3b29;
        color: var(--text);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        cursor: pointer;
      }

      /* The club grid — three across, four down, twelve clubs (UC1 BR11). */
      .clubs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.625rem;
        margin: 1rem 0;
      }

      .club {
        min-height: 4rem;
        background: var(--surface);
        color: var(--text);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        font-size: 1.375rem;
        font-weight: 700;
        cursor: pointer;
      }

      .club:active {
        background: #24503a;
      }

      .tally {
        font-size: 1.0625rem;
        margin: 0.5rem 0;
      }

      .last-stroke {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        min-height: 3rem;
      }

      .last-stroke:empty {
        display: none;
      }

      .undo {
        min-height: 3rem;
        padding: 0 1.25rem;
        background: transparent;
        color: var(--text);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        font-size: 1rem;
        cursor: pointer;
      }

      .putts__grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 0.5rem;
      }

      .putt {
        min-height: 3.5rem;
        background: var(--surface);
        color: var(--text);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        font-size: 1.25rem;
        cursor: pointer;
      }

      .hole-nav {
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
        margin: 1rem 0;
      }

      /* The hole picker on the tee map: eighteen targets that still take a
         gloved thumb, wrapped rather than scrolled so none is hidden. */
      .hole-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
        margin: 0.75rem 0;
      }

      .hole-chip {
        min-width: 3rem;
        min-height: 3rem;
        background: var(--surface);
        color: var(--muted);
        border: 1px solid #2b5039;
        border-radius: 0.625rem;
        font-size: 1rem;
        cursor: pointer;
      }

      .hole-chip--set {
        color: var(--text);
        border-color: #3f7d5a;
      }

      .hole-chip--on {
        background: #24503a;
        color: var(--text);
        outline: 2px solid var(--ok);
      }

      .notice {
        padding: 0.75rem 0.875rem;
        border-radius: 0.5rem;
        border-left: 4px solid var(--muted);
        background: var(--surface);
        margin: 0 0 0.75rem;
        font-size: 0.9375rem;
      }

      .notice--ok {
        border-left-color: var(--ok);
      }
      .notice--warn {
        border-left-color: var(--warn);
      }
      .notice--fail {
        border-left-color: var(--fail);
      }

      .muted {
        color: var(--muted);
      }
      .warn-text {
        color: var(--warn);
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9375rem;
      }

      .table th,
      .table td {
        text-align: left;
        padding: 0.5rem 0.5rem;
        border-bottom: 1px solid #24503a;
      }

      .table th {
        color: var(--muted);
        font-weight: 600;
      }

      .table__distance {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      /* The round's totals. Set apart from the per-hole rows, because a column
         of eighteen numbers and their sum should not read as nineteen holes. */
      .table tfoot td {
        font-weight: 700;
        border-top: 2px solid #3f7d5a;
        border-bottom: none;
      }

      .scroll-x {
        overflow-x: auto;
        margin-bottom: 1.5rem;
      }

      /* The map (TD7). Height is fixed so tiles have somewhere to land. */
      .map {
        height: 60vh;
        min-height: 20rem;
        border-radius: 0.75rem;
        overflow: hidden;
        background: #0d1c14;
        margin-bottom: 0.75rem;
      }

      .attribution {
        color: var(--muted);
        font-size: 0.8125rem;
        margin: 0 0 1.5rem;
      }
    </style>
  </head>
  <body>
    <header class="appbar">
      <div>
        <h1><a class="brand" href="#/">GolfTrainer</a></h1>
      </div>

      <button
        id="menu-toggle"
        class="burger"
        type="button"
        aria-expanded="false"
        aria-controls="menu"
        aria-label="Menu"
      >
        <span class="burger__bars" aria-hidden="true"></span>
      </button>

      <!--
        One item, deliberately.

        The four destinations moved to the home screen, where they are tiles a
        gloved thumb can hit without opening anything first. What is left here
        is the one action that is not a destination: it does something to the
        app rather than taking you somewhere in it, and it is rare enough that
        burying it a tap deep is the point.
      -->
      <nav id="menu" class="menu" hidden aria-label="Main menu">
        <ul class="menu__list">
          <li>
            <button class="menu__item" type="button" data-action="load-new-version">
              Load new version
              <span class="menu__hint">
                Clears the cached app and reinstalls it. Your rounds are not affected.
              </span>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <noscript>GolfTrainer needs JavaScript to record a round.</noscript>
    <main id="view" class="screen"></main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
