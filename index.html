<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GolfTrainer</title>
    <!--
      Every path in this app is relative, never rooted at "/". GitHub Pages
      serves a project repository under /<repo>/, so an absolute path would
      resolve outside the app. Relative paths work at any mount point,
      including the root.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2f7f3'/%3E%3Cg fill='%23a8c0b0'%3E%3Ccircle cx='11' cy='12' r='2'/%3E%3Ccircle cx='19' cy='11' r='2'/%3E%3Ccircle cx='16' cy='18' r='2'/%3E%3Ccircle cx='23' cy='17' r='2'/%3E%3Ccircle cx='10' cy='20' r='2'/%3E%3C/g%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#1b4332" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /*
        Car mode (TD3) sets the type scale even on this diagnostic page: the
        on-course screen is read in sunlight, at arm's length, with gloves on.
        Nothing here should establish habits that screen cannot afford.
      */
      :root {
        --bg: #10231a;
        --surface: #16301f;
        --text: #f2f7f3;
        --muted: #a8c0b0;
        --ok: #4ade80;
        --warn: #fbbf24;
        --fail: #f87171;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem 2rem;
        background: var(--bg);
        color: var(--text);
        font:
          1.125rem/1.5 system-ui,
          -apple-system,
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.25rem;
      }

      .lede {
        color: var(--muted);
        margin: 0 0 2rem;
        font-size: 1rem;
      }

      /*
        Car mode (TD3). Every tap target below is at least 3rem, and the menu
        items are 4rem: this menu is opened on the sixteenth tee, one-handed,
        wearing a glove, with a group waiting. Anything smaller fails QG2.
      */
      .appbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        position: relative;
      }

      .burger {
        flex: none;
        width: 3.5rem;
        height: 3.5rem;
        display: grid;
        place-items: center;
        gap: 0;
        background: var(--surface);
        color: var(--text);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        cursor: pointer;
        padding: 0;
      }

      .burger:focus-visible,
      .menu__item:focus-visible {
        outline: 3px solid var(--ok);
        outline-offset: 2px;
      }

      .burger__bars,
      .burger__bars::before,
      .burger__bars::after {
        display: block;
        width: 1.5rem;
        height: 2px;
        background: currentColor;
        border-radius: 2px;
      }

      .burger__bars {
        position: relative;
      }

      .burger__bars::before,
      .burger__bars::after {
        content: '';
        position: absolute;
        left: 0;
      }

      .burger__bars::before {
        top: -0.5rem;
      }
      .burger__bars::after {
        top: 0.5rem;
      }

      .menu {
        position: absolute;
        top: 4rem;
        right: 0;
        z-index: 10;
        width: min(22rem, calc(100vw - 2.5rem));
        background: var(--surface);
        border: 1px solid #2b5039;
        border-radius: 0.75rem;
        box-shadow: 0 1rem 2rem rgb(0 0 0 / 45%);
        overflow: hidden;
      }

      .menu[hidden] {
        display: none;
      }

      .menu__list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .menu__item {
        width: 100%;
        min-height: 4rem;
        display: block;
        text-align: left;
        padding: 0.875rem 1.125rem;
        background: none;
        border: 0;
        border-bottom: 1px solid #23412e;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .menu__list li:last-child .menu__item {
        border-bottom: 0;
      }

      .menu__item:disabled {
        color: var(--muted);
        cursor: not-allowed;
      }

      .menu__hint {
        display: block;
        color: var(--muted);
        font-size: 0.875rem;
        margin-top: 0.125rem;
      }

      #status {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }

      .status {
        background: var(--surface);
        border-left: 6px solid var(--muted);
        border-radius: 0.5rem;
        padding: 1rem 1.125rem;
      }

      .status--ok {
        border-left-color: var(--ok);
      }
      .status--warn {
        border-left-color: var(--warn);
      }
      .status--fail {
        border-left-color: var(--fail);
      }

      .status__label {
        display: block;
        font-weight: 600;
      }

      .status__detail {
        display: block;
        color: var(--muted);
        font-size: 0.9375rem;
        margin-top: 0.25rem;
      }

      noscript {
        display: block;
        color: var(--fail);
      }
    </style>
  </head>
  <body>
    <header class="appbar">
      <div>
        <h1>GolfTrainer</h1>
        <p class="lede">Bootstrap check — offline shell, local database, storage durability.</p>
      </div>

      <button
        id="menu-toggle"
        class="burger"
        type="button"
        aria-expanded="false"
        aria-controls="menu"
        aria-label="Menu"
      >
        <span class="burger__bars" aria-hidden="true"></span>
      </button>

      <!--
        Three items are disabled and say so. They are the destinations the app
        is being built towards; showing them as if they worked would be a lie
        the first tap exposes.
      -->
      <nav id="menu" class="menu" hidden aria-label="Main menu">
        <ul class="menu__list">
          <li>
            <button class="menu__item" type="button" data-action="track-round" disabled>
              Track round
              <span class="menu__hint">Not built yet — waiting on how a stroke is recorded</span>
            </button>
          </li>
          <li>
            <button class="menu__item" type="button" data-action="plan-round" disabled>
              Plan round
              <span class="menu__hint">Not built yet — needs the map</span>
            </button>
          </li>
          <li>
            <button class="menu__item" type="button" data-action="manage-courses" disabled>
              Manage courses
              <span class="menu__hint">Not built yet — needs a course source</span>
            </button>
          </li>
          <li>
            <button class="menu__item" type="button" data-action="load-new-version">
              Load new version
              <span class="menu__hint">
                Clears the cached app and reinstalls it. Your rounds are not affected.
              </span>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <noscript>GolfTrainer needs JavaScript to record a round.</noscript>
    <ul id="status"></ul>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
