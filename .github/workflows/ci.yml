name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signals:
    name: Quality signals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` runs the postinstall hook, which vendors the PGlite runtime.
      - run: npm ci

      # Style (2.2.1)
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check

      # Static bug patterns (2.2.2) — type-aware checking of JSDoc-annotated JS.
      - name: Typecheck
        run: npm run typecheck

      # Duplication (2.2.3)
      - name: Duplication
        run: npm run duplication

      # Vulnerable dependencies (2.2.5). Security bug patterns (2.2.4) run as
      # part of Lint via eslint-plugin-security.
      - name: Dependency audit
        run: npm audit --audit-level=high

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # The offline suite is the only thing that can verify QG1: a real browser,
      # a real service worker, a real cold start with the network cut.
      - name: Offline end-to-end tests
        run: npm run test:e2e

      # The same suite against the assembled site mounted at /golftrainer/,
      # which is how GitHub Pages serves a project repository. Anything the app
      # resolves from "/" would land outside itself there, so this is what stops
      # a green build from deploying a broken app.
      - name: Offline end-to-end tests (GitHub Pages layout)
        run: npm run test:e2e:pages

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    # Only from the default branch, and only once the signals and both offline
    # suites are green. A deployment that skipped them could publish an app that
    # fails exactly where it matters — on a course, with no network.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [signals, test]
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Vendors PGlite via postinstall; the site is assembled from it.
      - run: npm ci

      # Copies exactly the files the two precache manifests name. Nothing is
      # compiled or bundled — TD2 still holds.
      - name: Assemble site
        run: npm run site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
