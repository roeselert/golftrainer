<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GolfTrainer">
  <title>GolfTrainer</title>

  <!--
    The source of truth for every icon. The PNGs beside it are generated by
    `npm run icons` and committed, because the two platforms that matter want
    raster: iOS ignores the manifest entirely and reads apple-touch-icon, and
    Chrome's installability check wants 192 and 512.

    Drawn for the maskable safe zone: every part of the mark sits inside the
    central circle of radius 40%, so Android can crop this to a circle, a
    squircle or a rounded square without cutting the flag off.
  -->

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4332" />
      <stop offset="1" stop-color="#0d1c14" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)" />

  <!--
    The green. It bleeds off all three edges on purpose: a shape that stopped
    short would read as a floating box rather than ground, and background is
    the one thing a maskable crop is allowed to eat.
  -->
  <path d="M -16 380 C 130 328, 382 328, 528 380 L 528 528 L -16 528 Z" fill="#1b4332" />
  <path d="M -16 380 C 130 328, 382 328, 528 380" fill="none" stroke="#2f6b4a" stroke-width="9" />

  <!-- The hole, and the flagstick standing in it. -->
  <ellipse cx="316" cy="347" rx="25" ry="9" fill="#0b1811" />
  <rect x="311" y="132" width="11" height="218" rx="5" fill="#f2f7f3" />

  <!-- The pennant, in the accent green the app uses for "recorded". -->
  <path d="M 311 140 L 190 178 L 311 216 Z" fill="#4ade80" />

  <!-- The ball, resting on the green: the thing the app exists to record. -->
  <circle cx="168" cy="306" r="42" fill="#f2f7f3" />
  <g fill="#b9cdc0">
    <circle cx="154" cy="292" r="5.5" />
    <circle cx="174" cy="288" r="5.5" />
    <circle cx="186" cy="306" r="5.5" />
    <circle cx="164" cy="312" r="5.5" />
    <circle cx="150" cy="322" r="5.5" />
    <circle cx="178" cy="326" r="5.5" />
  </g>
</svg>
